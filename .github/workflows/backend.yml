name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  # Must match the Lambda runtime in zappa_settings.json.
  PYTHON_VERSION: "3.13"

permissions:
  id-token: write # required to exchange the GitHub OIDC token for AWS credentials
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # No DATABASE_URL, so this runs against SQLite and needs no cloud access.
      - name: Run tests
        run: python manage.py test --verbosity 2

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Zappa refuses to run outside an active virtualenv - it builds the Lambda
      # package from the environment's site-packages, so it needs to know where that
      # is. Runners install into the system Python, hence the explicit venv.
      - name: Install dependencies into a virtualenv
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::484907516843:role/dakkamotors-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Zappa probes / immediately after uploading, before migrations have run. Any
      # release that adds a column therefore fails that probe even though the deploy
      # itself is fine - and worse, retrying it while the schema is behind is how a
      # half-applied migration happens. The probe is not the gate; the smoke test at
      # the end of this job is.
      - name: Deploy to Lambda
        run: |
          . .venv/bin/activate
          zappa update production || echo "::warning::Zappa's post-deploy probe failed; migrations run next"

      - name: Apply database migrations
        run: |
          . .venv/bin/activate
          zappa manage production migrate

      # Re-asserted every deploy so ensure_inventory_group.py stays the source of
      # truth: permissions granted by hand in the admin are reconciled away here.
      # Creating accounts is deliberately not part of a deploy.
      - name: Reconcile the Inventory Managers group
        run: |
          . .venv/bin/activate
          zappa manage production ensure_inventory_group

      - name: Collect static files to S3
        run: |
          . .venv/bin/activate
          zappa manage production "collectstatic --noinput"

      # The real gate. Hits the origin directly rather than the CDN, so a cached page
      # cannot mask a broken deploy.
      - name: Smoke test the deployed backend
        env:
          ORIGIN: https://q0zvyay9pa.execute-api.ap-northeast-1.amazonaws.com/production
        run: |
          failed=0
          for path in "/" "/api/cars/" "/robots.txt" "/sitemap.xml" "/llms.txt"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${ORIGIN}${path}")
            echo "  ${path} -> ${code}"
            [ "$code" = "200" ] || failed=1
          done
          exit $failed
