name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  # Must match the Lambda runtime in zappa_settings.json.
  PYTHON_VERSION: "3.13"

permissions:
  id-token: write # required to exchange the GitHub OIDC token for AWS credentials
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # DynamoDB Local, not moto. The booking design rests on attribute-to-attribute
    # comparison inside a ConditionExpression, the positional codes in
    # CancellationReasons, ReturnValuesOnConditionCheckFailure returning the offending
    # item, and ValidationException on two operations against one item. A Python
    # reimplementation of those is the wrong thing to test against - a false green there
    # would be the worst outcome available.
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports:
          - 8123:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Dev requirements: the same file plus the local Cognito stand-in. The deploy
      # job below installs requirements.txt alone, so none of it reaches the Lambda.
      - run: pip install -r requirements-dev.txt

      # The credentials are placeholders: DynamoDB Local validates the signature's shape
      # but not the key, and nothing here reaches real AWS.
      - name: Run tests
        env:
          DYNAMODB_ENDPOINT_URL: http://localhost:8123
          DDB_TABLE: dakkamotors_test
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_DEFAULT_REGION: ap-northeast-1
        run: python manage.py test --verbosity 2

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Zappa refuses to run outside an active virtualenv - it builds the Lambda
      # package from the environment's site-packages, so it needs to know where that
      # is. Runners install into the system Python, hence the explicit venv.
      - name: Install dependencies into a virtualenv
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::484907516843:role/dakkamotors-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Zappa probes / immediately after uploading and treats a non-200 as a failed
      # deploy. It is not a reliable gate: the probe can hit a cold start, and on any
      # release that changes vpc_config it runs while the ENIs are still detaching. The
      # smoke test at the end of this job is the gate - it retries nothing and checks
      # five paths, so a genuinely broken deploy still fails the run.
      - name: Deploy to Lambda
        run: |
          . .venv/bin/activate
          zappa update production || echo "::warning::Zappa's post-deploy probe failed; the smoke test below is the gate"

      # There is no schema to migrate and no permission group to reconcile. Both steps
      # existed because the ORM did: one applied migrations after Zappa's probe had
      # already failed against the old schema, the other reconciled permissions that
      # could be granted by hand in the admin. Neither has anything to act on now, and
      # the smoke test below is what actually gates the deploy.
      - name: Check the deployed settings
        run: |
          . .venv/bin/activate
          zappa manage production "check --deploy"

      - name: Collect static files to S3
        run: |
          . .venv/bin/activate
          zappa manage production "collectstatic --noinput"

      # The real gate. Hits the origin directly rather than the CDN, so a cached page
      # cannot mask a broken deploy.
      - name: Smoke test the deployed backend
        env:
          ORIGIN: https://q0zvyay9pa.execute-api.ap-northeast-1.amazonaws.com/production
        run: |
          failed=0
          for path in "/" "/api/cars/" "/robots.txt" "/sitemap.xml" "/llms.txt"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${ORIGIN}${path}")
            echo "  ${path} -> ${code}"
            [ "$code" = "200" ] || failed=1
          done

          # The staff pages must turn a stranger away rather than 500. One check that
          # proves the pool id, the client id and the callback URL all line up - which
          # is exactly the class of thing that breaks silently.
          code=$(curl -s -o /dev/null -w "%{http_code}" "${ORIGIN}/api/staff/cars/")
          echo "  /api/staff/cars/ -> ${code}"
          [ "$code" = "302" ] || failed=1

          exit $failed
