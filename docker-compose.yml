# DynamoDB Local, for running the store tests.
#
# Deliberately DynamoDB Local rather than moto: the booking design rests on
# attribute-to-attribute comparison inside a ConditionExpression, the positional codes in
# CancellationReasons, ReturnValuesOnConditionCheckFailure returning the offending item,
# and ValidationException on two operations against one item. Those must be exercised
# against the real engine -- a false green from a reimplementation is the worst outcome
# available here.
#
#   docker compose up -d dynamodb
#   cd backend && DYNAMODB_ENDPOINT_URL=http://localhost:8123 DDB_TABLE=dakkamotors_test #     AWS_ACCESS_KEY_ID=local AWS_SECRET_ACCESS_KEY=local python manage.py test
#
# DDB_TABLE matters even locally. It defaults to the production name, so the one time
# somebody runs the suite with real credentials and no endpoint override, that is the
# table the truncation between tests would empty.
#
# -inMemory means state is dropped on restart, which is what we want: the test base class
# truncates between tests and nothing should ever depend on a previous run.

services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: dakkamotors-dynamodb
    command: -jar DynamoDBLocal.jar -inMemory -port 8000
    ports:
      # Host 8123 so it never collides with `manage.py runserver` on 8000. The container
      # side matches the CI service in .github/workflows/backend.yml.
      - "8123:8000"
