<!-- The Dakka Motors monogram.

     The filename outlived the artwork it was named for. This used to be the kei-car
     number plate; it is now the DM monogram. It keeps the name because `/plate.svg` is
     pinned in three places that a rename would have to move in step — most awkwardly
     its own CloudFront behaviour in `infra/edge.yaml`, which is a distribution update
     rather than a frontend deploy. Not worth it for a filename nobody types. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Dakka Motors">
  <title>Dakka Motors</title>
  <defs>
    <!-- Chrome, sampled off the master artwork: a bright band through the middle with
         steel either side. The dark stops are lifted well above the artwork's, because
         at 16px a favicon is read as light-on-dark before it is read as letters, and
         the true shadow tones turned the mark to mud at that size. -->
    <linearGradient id="dm-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf2"/>
      <stop offset="0.18" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#b0bcc8"/>
      <stop offset="0.52" stop-color="#f2f6f9"/>
      <stop offset="0.72" stop-color="#96a3b0"/>
      <stop offset="1" stop-color="#dde4ea"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#1b2734"/>
  <g transform="translate(8.32 21.37) scale(0.4833)" fill="url(#dm-chrome)">
    <!-- D: flat stem, squared bowl, landscape counter. Carried over unchanged from the
         plate mark — it was drawn to the kei silhouette and still is. -->
    <path fill-rule="evenodd"
          d="M0 0 H30 Q46 0 46 16 V28 Q46 44 30 44 H0 Z
             M12 12 H27 Q34 12 34 19 V25 Q34 32 27 32 H12 Z"/>
    <!-- M: square stems, pointed centre, echoing the sharp apexes of the artwork. -->
    <path transform="translate(52 0)"
          d="M0 44 V0 H11 L23 21 L35 0 H46 V44 H35 V17 L23 38 L11 17 V44 Z"/>
  </g>
</svg>
