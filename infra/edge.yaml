AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Dakka Motors - CloudFront distribution and TLS certificate.
  MUST be deployed to us-east-1: CloudFront only accepts ACM certificates issued
  there. The origins it points at (API Gateway, S3) live in ap-northeast-1.

  One distribution serves the React app and the Django API from a single origin,
  which is why the project has no CORS configuration anywhere.

Parameters:
  FrontendBucketDomain:
    Type: String
    Description: Regional domain name of the frontend bucket

  MediaBucketDomain:
    Type: String
    Description: Regional domain name of the media bucket

  ApiGatewayDomain:
    Type: String
    Description: Host part of the Zappa API Gateway URL (no scheme, no path)

  ApiGatewayStage:
    Type: String
    Default: production
    Description: Zappa stage, used as the origin path so Django sees clean URLs

  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM certificate ARN in us-east-1. Leave empty on the first deploy: the
      distribution then serves on its own *.cloudfront.net name, so the site works
      before DNS delegation completes. Set it once the certificate is Issued.

  DomainNames:
    Type: CommaDelimitedList
    Default: ""
    Description: Aliases to attach. Ignored while CertificateArn is empty.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  # S3 buckets stay private; only this distribution can read them.
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: dakkamotors-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Short TTL on the public car endpoints. This is what keeps Aurora asleep: repeat
  # visitors are served from the edge and never reach the database.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: dakkamotors-api-short
        Comment: 60s edge cache for public car endpoints
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  # HTML is cached for five minutes. Long enough that crawlers and repeat visitors
  # rarely reach Lambda (and so Aurora keeps scaling to zero), short enough that a car
  # added in the admin shows up without an invalidation. Language is part of the cache
  # key because ?lang= changes the whole document.
  PageCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: dakkamotors-pages
        Comment: Server-rendered HTML
        MinTTL: 0
        DefaultTTL: 300
        MaxTTL: 900
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Accept-Language]
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings: [lang]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Dakka Motors
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Aliases: !If [HasCustomDomain, !Ref DomainNames, !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        Origins:
          - Id: frontend
            DomainName: !Ref FrontendBucketDomain
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }

          - Id: media
            DomainName: !Ref MediaBucketDomain
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }

          - Id: api
            DomainName: !Ref ApiGatewayDomain
            OriginPath: !Sub /${ApiGatewayStage}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              HTTPSPort: 443

        # Pages are rendered by Django now, not served as a static shell. That is what
        # gives every URL its own title, description and structured data - a static
        # index.html can only ever carry one set, so link previews and answer engines
        # saw the same generic page for every car. Cached at the edge so the origin is
        # hit rarely and the database stays asleep.
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref PageCachePolicy
          # Managed-AllViewerExceptHostHeader
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

        CacheBehaviors:
          # Listing endpoints: cacheable, and the reason the database can stay paused.
          - PathPattern: /api/cars*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            # Managed-AllViewerExceptHostHeader
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

          # Everything else under /api/ includes the admin: never cache it.
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

          # Hashed bundles: straight from S3, never through Lambda.
          - PathPattern: /assets/*
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

          - PathPattern: /plate.svg
            TargetOriginId: frontend
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

          - PathPattern: /static/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

          - PathPattern: /media/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Description: Works immediately, before DNS delegation completes
    Value: !GetAtt Distribution.DomainName
