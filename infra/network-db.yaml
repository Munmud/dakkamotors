AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Dakka Motors - storage (ap-northeast-1).
  Two S3 buckets: the built frontend behind CloudFront, and the media bucket that holds
  car photos, their derivatives and the email outbox.

  This stack held a VPC and an Aurora Serverless v2 cluster until the DynamoDB cutover.
  Both are gone: DynamoDB and Cognito are reachable from the public internet, so the
  Lambda left the VPC and the no-NAT constraint that shaped half this repo went with it.
  The filename is kept so the stack keeps its name - CloudFormation identifies a stack by
  name, and renaming the file would tempt somebody into creating a second one.

Parameters:
  FrontendBucketName:
    Type: String
    Default: dakkamotors-frontend

  MediaBucketName:
    Type: String
    Default: dakkamotors-backend-media

Resources:
  # -------------------------------------------------------------------- storage ---
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref MediaBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # POST is required because the admin uploads photos and video straight to S3 with
      # a presigned POST, bypassing Lambda's ~4.5MB request ceiling. Origins are named
      # explicitly rather than "*": a bucket that accepts browser uploads should not
      # advertise itself to every origin on the internet.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD, POST]
            AllowedOrigins:
              - https://dakkamotors.com
              - https://www.dakkamotors.com
              - http://localhost:5173
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  # Both buckets stay private and are readable only through CloudFront (Origin Access
  # Control). The distribution does not exist yet when this stack is created, so the
  # policy is scoped to any distribution owned by this account rather than one id.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringLike:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*
            Condition:
              StringLike:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

Outputs:
  # infra/edge.yaml takes all four as parameters. Do not rename them.
  FrontendBucket:
    Value: !Ref FrontendBucket
  MediaBucket:
    Value: !Ref MediaBucket
  MediaBucketDomain:
    Value: !GetAtt MediaBucket.RegionalDomainName
  FrontendBucketDomain:
    Value: !GetAtt FrontendBucket.RegionalDomainName
