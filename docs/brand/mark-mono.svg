<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98 44" width="98" height="44"
     role="img" aria-label="Dakka Motors">
  <title>Dakka Motors</title>
  <!-- One flat colour, no gradient. For anywhere the chrome cannot survive: a light
       ground, a fax, an engraver, a single-colour stamp, or a partner's logo strip
       that wants everything in their ink. `currentColor` so it takes the colour of
       whatever encloses it rather than carrying an opinion. -->
  <g fill="currentColor">
    <path fill-rule="evenodd"
          d="M0 0 H30 Q46 0 46 16 V28 Q46 44 30 44 H0 Z
             M12 12 H27 Q34 12 34 19 V25 Q34 32 27 32 H12 Z"/>
    <path transform="translate(52 0)"
          d="M0 44 V0 H11 L23 21 L35 0 H46 V44 H35 V17 L23 38 L11 17 V44 Z"/>
  </g>
</svg>
